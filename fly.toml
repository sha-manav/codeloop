# Fly.io app for the CodeLoop review / audit UI. Deploy with `make fly-deploy-audit` or
# `make fly-deploy-review BATCH=batch1 VERSION=v0`. Set credentials once:
#   fly secrets set CODELOOP_UI_USER=... CODELOOP_UI_PASS=...
# Exactly one machine (SQLite on the volume); holdout labeling is never served from Fly.
app = "codeloop-ui"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.ui"

[env]
  CODELOOP_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # No HTTP health check: /health sits behind basic auth like every other route, and a check that fails
  # keeps the machine out of routing. Fly falls back to process health. To add an authenticated check,
  # define [[http_service.checks]] with path = "/health" and an Authorization header (base64 of user:pass).

[[mounts]]
  source = "codeloop_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
