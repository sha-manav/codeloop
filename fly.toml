# Fly.io app for the CodeLoop review / audit UI. Deploy with `make fly-deploy-audit` or
# `make fly-deploy-review BATCH=batch1 VERSION=v0`. Set credentials once:
#   fly secrets set CODELOOP_UI_USER=... CODELOOP_UI_PASS=...
# Exactly one machine (SQLite on the volume); holdout labeling is never served from Fly.
app = "codeloop-ui"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.ui"

[env]
  CODELOOP_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    # /health sits behind basic auth like every other route; a TCP-level check keeps credentials out of this file.
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false
    [http_service.checks.headers]
      # Optional: uncomment and paste base64("user:pass") to make the HTTP check pass through auth.
      # Authorization = "Basic ..."

[[mounts]]
  source = "codeloop_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
