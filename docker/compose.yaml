# docker compose -f docker/compose.yaml run --rm task    (from the repo root)
# Mounts the repo read-write except: data/sealed is not mounted (an empty tmpfs shadows it),
# codeloop/scoring and config are mounted read-only. Network egress only via the squid allowlist.
services:
  proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
    networks: [egress, internal]
  task:
    build:
      context: ..
      dockerfile: docker/task-env.Dockerfile
    depends_on: [proxy]
    environment:
      - ANTHROPIC_API_KEY
      - CODELOOP_TASK
    volumes:
      - ..:/repo
      - ../codeloop/scoring:/repo/codeloop/scoring:ro
      - ../codeloop/compliance:/repo/codeloop/compliance:ro
      - ../config:/repo/config:ro
      - ../data/splits:/repo/data/splits:ro
      - ../data/labels:/repo/data/labels:ro
      - ../data/labels_public:/repo/data/labels_public:ro
      - ../evals/datasets:/repo/evals/datasets:ro
      - ../evals/suites:/repo/evals/suites:ro
      - ../findings:/repo/findings:ro
    tmpfs:
      - /repo/data/sealed   # invariant I5: sealed holdout never mounted
    networks: [internal]
    command: bash -lc "uv sync --frozen --group dev && exec bash"
networks:
  internal:
    internal: true
  egress: {}
