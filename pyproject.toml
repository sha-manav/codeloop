[project]
name = "codeloop"
version = "0.1.0"
description = "CodeLoop: an outpatient professional-coding agent wrapped in a self-improvement harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12",
  "pyyaml>=6.0",
  "cryptography>=43",
  "anthropic>=1.6.0",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
codeloop = "codeloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"codeloop/cli.py" = ["B008"]          # typer.Option(...) defaults are the Typer idiom
"codeloop/ingest/report.py" = ["E501"]  # long Markdown lines in the report template
"codeloop/audit/ui.py" = ["E501"]       # HTML template strings
"codeloop/review_ui/app.py" = ["E501"]  # HTML/JS template strings
"codeloop/audit/report.py" = ["E501"]   # Markdown report template
"tests/*" = ["E501"]
"codeloop/reporting/*" = ["E501"]  # Markdown report templates
