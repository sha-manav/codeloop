name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for tests/test_scoring_frozen.py (invariant I3)
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check codeloop tests
      - run: uv run pytest -q   # includes tests/test_no_holdout_leakage.py (invariant I1)
