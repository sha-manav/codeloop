hypothesis: 'The extractor lists the diabetes problem every time (4 of 4, status active;
  note quotes present in 3 of 4), but the lexical ICD-10-CM retrieval does not put
  E119 (or any E11 code) among the candidates when the problem description carries
  qualifiers such as control, stability or lab findings: BM25 over all tokens ranks
  gestational-diabetes, abnormal-glucose or retinopathy codes instead. The mapper
  is told to choose only from the candidates, so it returns null (D2N152, D2N193)
  or settles for a symptom code (D2N135: R7309, later recoded by the coder to E119).
  Its own rationale names the missing code in each case. D2N046 is different: the
  note does not mention diabetes (dialogue only), so under the note-only evidence
  policy the draft is by design and the coder''s add is a judgment about evidence,
  not a retrieval miss.'
