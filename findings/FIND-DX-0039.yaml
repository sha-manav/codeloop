triage_notes: '| batch3 (2026-09-22): Eligible under D3 (D2N138 in batch1; D2N095,
  D2N130 in batch3: R0981 replaced by J309, reason specificity). Set to AMBIGUOUS,
  not accepted: in the same batch the coder kept R0981 in D2N008 and D2N089, whose
  v2 problem descriptions have the same shape (nasal congestion attributed to allergies)
  and whose note evidence sits in the same kind of section (outside the assessment
  and plan in all four; no rhinitis wording in any of the four assessment/plan sections).
  A rule cannot reproduce both. Question for the coder: when a symptom is documented
  as due to a named condition, is the condition coded instead of the symptom? If yes,
  the fix is a cause-term retry (a second map_dx call for symptom-coded problems whose
  description names a cause; first call unchanged) and D2N008/D2N089 would change
  too. | 2026-09-22, later: coder answered ''I usually code the cause if the cause
  is documented'' -> ACCEPTED. Fix: a cause-term retry, a second map_dx call for symptom-coded
  problems whose description names a cause, offering candidates for the cause term;
  the first call is unchanged and a retry result is taken only when it is a definitive
  condition code (not a symptom, status or external-cause code). Expected to flip
  D2N008 and D2N089 against their labels; accepted as the cost of the coder''s stated
  rule.'
