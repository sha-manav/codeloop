# CodeLoop project configuration: decisions (D0–D10), seeds, run parameters, data sources.
# Decisions are confirmed or changed by the owner during Phases 0–3 and locked at the freeze.
# DECISIONS.md is rendered from this file (`make decisions`); edit here, not there.

project: codeloop
spec_version: "1.2"

expected_encounter_count: 207

holdout:
  n: 40
  stratify_on: subset   # n_s = round(40 * N_s / 207); largest subset absorbs the rounding remainder

seeds:
  seal_seed: 20260917        # D0 — holdout draw (Phase 0)
  split_seed: 20260918       # dev split into seed/batch1-3/spare and blind subsets (Phase 3); builder default, not a numbered decision
  second_cpc_seed: 20260919  # optional second-CPC subset in Phase 9; builder default
  audit_sample_seed: 20260920  # Phase 2 spot-check draw (15 flagged + 15 random); builder default
  bootstrap_seed: 20260921  # paired bootstrap resamples (D9); builder default

dev_split:
  seed: 20
  batches: 3
  batch_size: 45
  spare: 12
  blind_per_batch: 5   # D8

decisions:
  D0:
    name: Seal seed
    value: 20260917
    change_before: Phase 0
    status: locked
    confirmed_on: "2026-09-17"
    confirmed_by: owner
    rationale: >-
      Any fixed integer works; the value is recorded in the ledger together with the ID-list hash
      so the draw can be reproduced. Chosen as the project start date.
  D1:
    name: Evidence policy for billable fields
    value: note_only
    change_before: Phase 3
    status: locked
    rationale: >-
      The signed note is the medical record; a compliant coder does not code from the transcript.
      Dialogue-only facts become provider queries. Alternative: note_or_dialogue (coder guidelines
      must then say the same, or every dialogue-supported field will be graded unsupported).
  D2:
    name: Coder-facing reason taxonomy
    value: [missed, unsupported, specificity, wrong_value, guideline, query_needed, judgment]
    change_before: Phase 3
    status: locked
    rationale: >-
      One click per edit, describing the coding error rather than the software. Pipeline causes
      (extraction_miss, mapper_gap, tool_data_gap, rule_bug, grader_bug, model_reasoning) are
      assigned at triage, never by the coder.
  D3:
    name: Minimum occurrences for a finding
    value: {in_batch: 3, if_seen_in_prior_batch: 2}
    change_before: Phase 3
    status: locked
    rationale: >-
      A candidate becomes eligible at >=3 encounters in the batch, or >=2 if the same grouping key
      appeared in a prior batch; below that it stays a candidate and is re-checked next batch.
  D4:
    name: Eval runs per candidate
    value: {runs: 3, seeds: [1, 2, 3], temperature: null, provider_seed: null}
    change_before: Phase 3
    status: locked
    rationale: >-
      Three runs per candidate, reported as mean, per-run values and run-to-run variance. The pinned
      model (claude-opus-5, see config/models.yaml) accepts neither a temperature nor a seed parameter,
      so both are recorded as null; the seeds 1..3 are requested-seed labels that discriminate the
      three runs in the LLM cache key and in traces, not provider sampling controls.
  D5:
    name: Gate thresholds
    value:
      targeted_relative_error_reduction_min: 0.25
      targeted_no_run_may_rise: true
      regression_mean_agreement_drop_max_pp: 1.0
      regression_per_type_recall_drop_max_pp: 2.0
      scrubber_errors: non_increasing
      compliance_escalation_check: required
    change_before: Phase 3
    status: locked
    rationale: >-
      Targeted error rate must fall by at least 25% relative (mean over runs) without rising on any
      run; regression agreement may drop at most 1.0 pp and no per-type recall more than 2.0 pp;
      scrubber error count may not increase; the escalation check must pass for every encounter.
  D6:
    name: Minimum evaluable n for module-level holdout reporting
    value: 10
    change_before: Phase 3
    status: locked
    rationale: Below 10 evaluable encounters a module result is reported as "insufficient (n=...)".
  D7:
    name: When holdout predictions are generated
    value: at_each_version_freeze_sealed
    change_before: Phase 3
    status: locked
    rationale: >-
      Sealed predictions are produced at each version freeze so a model retirement between
      versions cannot break the final comparison; an optional re-run of all four happens after v3.
  D8:
    name: Blind subset size and official label
    value: {blind_per_batch: 5, official_label: reviewed}
    change_before: Phase 3
    status: locked
    rationale: >-
      Five encounters per batch (11%) are coded blind before the draft is revealed; the reviewed
      label is official and the blind label feeds the anchoring analysis.
  D9:
    name: Primary inferential metric
    value:
      primary: mean_per_encounter_field_agreement
      interval: paired_bootstrap_95
      resamples: 10000
      tiers: [0.75, 0.90, 1.0]
      tier_intervals: wilson
    change_before: Phase 3
    status: locked
    rationale: >-
      With n = 40 a binary 100% tier has +-15 pp intervals and cannot separate versions; the
      continuous mean with paired bootstrap CIs can. Tier shares are headline descriptives.
  D10:
    name: Module activation rule
    value: {evaluable_n_est_min: 15, spot_check_confirmed_min: 5}
    change_before: Phase 2
    status: locked
    rationale: >-
      A module is on iff evaluable_n_est = flagged x spot-check precision >= 15 and at least five
      flags were confirmed in the spot-check.

